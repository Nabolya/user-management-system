spring.application.name=user-management-system

# PostgreSQL connection - update credentials/db name to match your local setup
spring.datasource.url=jdbc:postgresql://localhost:5432/user_management_db
spring.datasource.username=postgres
spring.datasource.password=neblo_23
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# update -> keeps schema in sync with entities and preserves data across restarts
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080
